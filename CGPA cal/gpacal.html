<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA & CGPA Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>GPA & CGPA Calculator</h1>
        <p class="subtitle">Calculate your semester GPA and overall CGPA</p>

        <div class="input-box">
            <label for="courseCount">Number of Courses</label>
            <input type="number" id="courseCount" min="1" placeholder="Enter number of courses">

            <button onclick="createCourses()">Add Courses</button>
        </div>

        <div id="courses"></div>

        <button id="calculateBtn" onclick="calculateGPA()" style="display:none;">
            Calculate GPA
        </button>

        <div id="result" class="result" style="display:none;">
            <h2>Result</h2>

            <p>Total Credits:
                <strong id="totalCredits">0</strong>
            </p>

            <p>Total Grade Points:
                <strong id="totalPoints">0</strong>
            </p>

            <p>Semester GPA:
                <strong id="gpa">0.00</strong>
            </p>

            <p>Overall CGPA:
                <strong id="cgpa">0.00</strong>
            </p>

            <h3>Course Details</h3>
            <div id="courseResults"></div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
